<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID//OVERSEER - Agent Simulation Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>GRID//OVERSEER</h1>
            <div class="header-info">
                <span id="sim-status">PAUSED</span>
                <span id="sim-tick">Tick: 0</span>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="main-container">
            <!-- Left: Canvas Map -->
            <div class="map-container">
                <canvas id="map-canvas" width="800" height="600"></canvas>
                <div class="map-controls">
                    <button id="btn-recenter">Center on Base</button>
                </div>
            </div>

            <!-- Right: Control Panel -->
            <div class="control-panel">
                <!-- Simulation Controls -->
                <section class="panel-section">
                    <h2>SIMULATION</h2>
                    <div class="sim-controls">
                        <button id="btn-play" class="btn-primary">PLAY</button>
                        <button id="btn-pause" class="btn-primary">PAUSE</button>
                        <div class="speed-controls">
                            <label>Speed:</label>
                            <button id="btn-speed-1x" class="btn-speed active">1x</button>
                            <button id="btn-speed-2x" class="btn-speed">2x</button>
                            <button id="btn-speed-4x" class="btn-speed">4x</button>
                        </div>
                    </div>
                </section>

                <!-- Agent List -->
                <section class="panel-section">
                    <h2>AGENTS</h2>
                    <div id="agent-list" class="agent-list">
                        <!-- Populated dynamically -->
                    </div>
                </section>

                <!-- Selected Agent Details -->
                <section class="panel-section">
                    <h2>SELECTED AGENT</h2>
                    <div id="agent-details" class="agent-details">
                        <p class="text-muted">No agent selected</p>
                    </div>
                </section>

                <!-- Mission Assignment -->
                <section class="panel-section">
                    <h2>MISSION ASSIGNMENT</h2>
                    <div class="mission-controls">
                        <select id="mission-agent" class="mission-select">
                            <option value="">Select Agent</option>
                        </select>
                        <select id="mission-type" class="mission-select">
                            <option value="explore">Explore Sector</option>
                        </select>
                        <div class="mission-params">
                            <input type="number" id="mission-x" placeholder="X" min="0" max="19" class="mission-input">
                            <input type="number" id="mission-y" placeholder="Y" min="0" max="19" class="mission-input">
                        </div>
                        <button id="btn-assign-mission" class="btn-primary">Assign Mission</button>
                    </div>
                </section>

                <!-- Narration Toggle -->
                <section class="panel-section">
                    <h2>NARRATION</h2>
                    <div class="narration-controls">
                        <label>
                            <input type="checkbox" id="toggle-narration">
                            Enable Mission Reports
                        </label>
                    </div>
                </section>
            </div>
        </div>

        <!-- Bottom: Event Log -->
        <div class="event-log-container">
            <h3>EVENT LOG</h3>
            <div id="event-log" class="event-log">
                <!-- Events appear here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
